*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}

.bezel{flex:1;background:#0a0a0a;border-radius:10px;padding:10px}
canvas{display:block;width:100%;height:auto;aspect-ratio:240/135;image-rendering:pixelated;image-rendering:crisp-edges}
.side{width:16%;min-width:64px;display:flex;flex-direction:column;align-items:center;gap:18px}
.side button{border:0;cursor:pointer;color:#fff;font:600 11px system-ui;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
.bA{width:48px;height:48px;border-radius:50%;background:#2b2b2b}
.bB{width:34px;height:16px;border-radius:8px;background:#3a3a3a}
.lab{font-size:11px;color:#2b1500;font-weight:600;margin-top:-12px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.row button{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font:inherit;font-size:13px;cursor:pointer}
.row button.on{background:var(--ink);color:var(--bg)}
.note{color:var(--mut);font-size:13px;margin-top:14px}
</style></head><body><main>
<h1>Santa tracker · M5Stick preview</h1>

<div class="row" id="tabs"><button class="on">1 · Santa cam</button><button>2 · Dashboard</button><button>3 · Radar</button></div>
<div class="row"><button id="auto">Auto-cycle: off</button><button id="spd">Speed: ×1</button><button id="skip">Skip to next city ▸</button></div>
<p class="note">Demo journey: 15 cities, 16 s each (flight, landing, chimney, gift). Counters and the map follow the same clock, as they would from one data feed.</p>
</main>

 R('#070b26',0,0,W,50);R('#0d1440',0,50,W,45);R('#16205a',0,95,W,40);

 if(u>=12.5&&u<15.5){const q=(u-12.5)/3,yy=50-q*26;x.globalAlpha=1-q*q;gbox(68,yy);TX('+1',84,yy+2,'#ffd54a');R('#fff',64,yy-3,2,2);R('#fff',84,yy+12,2,2);x.globalAlpha=1}
