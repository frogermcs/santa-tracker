name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  web:
    name: Web App Build (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: page/package-lock.json
      - name: Install Dependencies
        run: cd page && npm ci
      - name: Lint
        run: cd page && npm run lint
      - name: Run Tests & Typecheck
        run: cd page && npm test
      - name: Build Next.js
        run: cd page && npm run build

  firmware-tests:
    name: Firmware Native Tests & Build (PlatformIO)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO Core
        run: pip install --upgrade platformio
      - name: Run Native Unit Tests (Desktop)
        run: cd firmware && pio test -e native
      - name: Compile ESP32 Firmware
        run: cd firmware && pio run -e m5stick-c
