<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Santa Hat Top Red -->
  <path d="M 16 3 C 12 3 9 7 9 12 L 23 12 C 23 7 20 3 16 3 Z" fill="#e11d48"/>
  <!-- Hat Fold & Ball -->
  <path d="M 22 8 Q 26 11 26 15" fill="none" stroke="#e11d48" stroke-width="3" stroke-linecap="round"/>
  <circle cx="26" cy="16" r="3" fill="#ffffff"/>
  
  <!-- Hat White Trim / Brim -->
  <rect x="7" y="11" width="18" height="4" rx="2" fill="#ffffff"/>
  
  <!-- Face (Skin Tone) -->
  <rect x="9" y="14" width="14" height="7" fill="#fbcfe8"/>
  <circle cx="11" cy="18" r="1.5" fill="#fda4af"/> <!-- Rosy cheek -->
  <circle cx="21" cy="18" r="1.5" fill="#fda4af"/> <!-- Rosy cheek -->
  
  <!-- Eyes -->
  <circle cx="12.5" cy="16" r="1.2" fill="#0f172a"/>
  <circle cx="19.5" cy="16" r="1.2" fill="#0f172a"/>
  
  <!-- Big Red Nose -->
  <ellipse cx="16" cy="18" rx="2" ry="1.5" fill="#ef4444"/>
  
  <!-- Fluffy White Moustache & Beard -->
  <path d="M 7 19 C 7 27 11 30 16 30 C 21 30 25 27 25 19 C 22 21 19 21 16 20 C 13 21 10 21 7 19 Z" fill="#ffffff"/>
  <!-- Moustache detail -->
  <path d="M 12 19 C 14 21 16 21 16 19 C 16 21 18 21 20 19" fill="none" stroke="#e2e8f0" stroke-width="1.2" stroke-linecap="round"/>
</svg>
