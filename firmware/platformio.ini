; PlatformIO Project Configuration File for M5StickC Plus SE
;
; Target: ESP32-PICO-D4 with ST7789v2 240x135 IPS Display

[env:m5stick-c]
platform = espressif32
board = m5stick-c
framework = arduino

monitor_speed = 115200
upload_speed = 1500000

board_build.partitions = huge_app.csv

build_flags = 
    -DARDUINO_M5Stick_C_PLUS
    -DCORE_DEBUG_LEVEL=0

build_src_filter = 
    +<*>

lib_deps = 
    m5stack/M5Unified@^0.2.0
    bblanchon/ArduinoJson@^7.2.1

; Desktop Native Test Environment (Runs instantly on macOS without flashing hardware!)
[env:native]
platform = native
test_framework = unity
test_build_src = yes

build_flags = 
    -std=c++17
    -DNATIVE_TEST

build_src_filter = 
    +<core/>
    +<network/>

lib_deps = 
    bblanchon/ArduinoJson@^7.2.1
